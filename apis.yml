description: Wuzzuf is Egypt's leading online recruitment platform, operated by Cairo-based
  BasharSoft and backed by investors including 500 Global. It connects millions of
  job seekers with tens of thousands of employers across Egypt and the Middle East,
  offering job search, applicant tracking, employer branding pages, and recruitment
  products for companies. Wuzzuf does not currently publish a public developer API,
  API documentation, or machine-readable API artifacts.
